name: Continuous Delivery

on:
  push:
    branches:
      - "staging-delivery"
  pull_request:
    branches:
      - "staging-delivery"

permissions:
  contents: write
  pull-requests: write

jobs:
  continuous-delivery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Run JS Unit Tests
        run: npm test

      - name: Build & Package Delivery Artifact
        run: |
          mkdir -p dist
          cp index.html script.js style.css colors.json dist/

      - name: Upload Delivery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: colordict-delivery-build
          path: dist/

      - name: Add Job Summary with PR Link
        if: always()
        run: |
          echo "## Continuous Delivery Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Unit tests & build completed." >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy Link**: [Click to Open Pull Request to Main](${{ github.server_url }}/${{ github.repository }}/compare/main...staging-delivery?expand=1)" >> $GITHUB_STEP_SUMMARY

      - name: Create Pull Request to Main
        if: github.ref == 'refs/heads/staging-delivery' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head staging-delivery \
            --title "Delivery Release: Sync staging-delivery to main" \
            --body "### Automated Continuous Delivery Build

          - JS Unit Tests passed successfully.
          - Release artifact \`colordict-delivery-build\` compiled and attached to this run.
          
          Merging this Pull Request will trigger **Continuous Deployment** to GitHub Pages." || echo "Pull Request already open, branches up to date, or GitHub Actions PR permission disabled."
